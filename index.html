<script>
let installPromptEvent;
const installButton=document.getElementById("install-app");
window.addEventListener("beforeinstallprompt",event=>{event.preventDefault();installPromptEvent=event;if(installButton)installButton.hidden=false;});
installButton?.addEventListener("click",async()=>{if(!installPromptEvent)return;installPromptEvent.prompt();await installPromptEvent.userChoice;installPromptEvent=null;installButton.hidden=true;});
window.addEventListener("appinstalled",()=>{if(installButton)installButton.hidden=true;});
if("serviceWorker" in navigator){let reloading=false,waitingWorker=null,updateAvailable=false;const announce=()=>window.dispatchEvent(new Event("one:pwa-update-ready"));window.OnePWAUpdate={get available(){return updateAvailable},apply(){if(waitingWorker)waitingWorker.postMessage({type:"SKIP_WAITING"})},check(){return navigator.serviceWorker.getRegistration("./").then(r=>r?.update()).catch(()=>{})}};navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloading)return;reloading=true;window.location.reload()});window.addEventListener("load",async()=>{try{const registration=await navigator.serviceWorker.register("./service-worker.js",{scope:"./",updateViaCache:"none"});const checkWaiting=()=>{if(registration.waiting&&navigator.serviceWorker.controller){waitingWorker=registration.waiting;updateAvailable=true;announce()}};checkWaiting();registration.addEventListener("updatefound",()=>{const worker=registration.installing;if(worker)worker.addEventListener("statechange",()=>{if(worker.state==="installed"&&navigator.serviceWorker.controller)checkWaiting()})});const check=()=>registration.update().then(checkWaiting).catch(()=>{});check();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")check()});window.setInterval(()=>{if(document.visibilityState==="visible")check()},3600000)}catch(error){console.warn("PWA update registration failed",error)}})}</script>
</body></html>
