name: Build One SMS Sync Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-sms-companion/**'
      - '.github/workflows/android-sms-companion.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: android-sms-companion
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: one-sms-sync-debug-apk
          path: android-sms-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
